name: Resource instructions
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    if: github.repository == 'APIEase/apiease-template' || github.repository == 'kevinstl-org/apiease-template'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test template and verify the committed instruction snapshot
        run: npm run validate:ci
